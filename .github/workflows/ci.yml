name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957
        env:
          POSTGRES_USER: printer_fleet
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: printer_fleet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U printer_fleet -d printer_fleet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.3.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fleet-console/package-lock.json
      - name: Test root-owned services and release policy
        env:
          PYTHONPATH: printer-fleet
          PRINTER_FLEET_TEST_POSTGRES_URL: postgresql://printer_fleet:test-only@127.0.0.1:5432/printer_fleet_test
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r printer-fleet/requirements-dev.txt
          .venv/bin/python -m pytest -q tests printer-fleet/tests ipp-gateway/tests/test_gateway.py
          npm --prefix fleet-console test
          node --check fleet-console/app.js
          python3 scripts/security_gate.py --self-test
          python3 -m py_compile scripts/build_compatibility_manifest.py scripts/container_smoke.py scripts/release_component.py scripts/validate_hardware_acceptance.py scripts/validate_release_env.py
      - name: Rehearse PostgreSQL backup and restore
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" pg_dump --username=printer_fleet --dbname=printer_fleet_test --format=custom --file=/tmp/printer-fleet.dump
          docker exec "$POSTGRES_CONTAINER" createdb --username=printer_fleet printer_fleet_restore
          docker exec "$POSTGRES_CONTAINER" pg_restore --username=printer_fleet --dbname=printer_fleet_restore --no-owner /tmp/printer-fleet.dump
          source_counts="$(docker exec "$POSTGRES_CONTAINER" psql --username=printer_fleet --dbname=printer_fleet_test --tuples-only --no-align --command="SELECT 'audit_records=' || COUNT(*) FROM audit_records UNION ALL SELECT 'deliveries=' || COUNT(*) FROM deliveries UNION ALL SELECT 'delivery_events=' || COUNT(*) FROM delivery_events UNION ALL SELECT 'printers=' || COUNT(*) FROM printers ORDER BY 1")"
          restored_counts="$(docker exec "$POSTGRES_CONTAINER" psql --username=printer_fleet --dbname=printer_fleet_restore --tuples-only --no-align --command="SELECT 'audit_records=' || COUNT(*) FROM audit_records UNION ALL SELECT 'deliveries=' || COUNT(*) FROM deliveries UNION ALL SELECT 'delivery_events=' || COUNT(*) FROM delivery_events UNION ALL SELECT 'printers=' || COUNT(*) FROM printers ORDER BY 1")"
          test "$source_counts" = "$restored_counts"
      - name: Validate source Compose
        run: docker compose config --quiet
  containers:
    needs: test
    uses: ./.github/workflows/container-gate.yml
