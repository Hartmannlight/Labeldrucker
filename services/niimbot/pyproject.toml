[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "printhub-niimbot"
version = "0.1.0"
description = "Durable PrintHub raster print service for NIIMBOT B1"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pyserial==3.5", "bleak>=0.22.3,<3", "portalocker>=3,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28.1,<1", "jsonschema>=4.26.0,<5"]

[tool.setuptools.packages.find]
include = ["niimbot_service*"]
