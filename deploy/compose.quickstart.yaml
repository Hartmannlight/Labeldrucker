name: ${COMPOSE_PROJECT_NAME:-printhub}

services:
  printer-fleet:
    image: ${PRINTER_FLEET_IMAGE:?Load deploy/quickstart.images.env}
    pull_policy: if_not_present
    environment:
      PRINTER_FLEET_DATABASE: /data/fleet.sqlite3
      PRINTER_FLEET_DELIVERY_WORKER_ENABLED: "1"
      PRINTER_FLEET_WORKER_INTERVAL_SECONDS: "1"
      PRINTER_FLEET_MAX_PARALLEL_PRINTERS: ${PRINTER_FLEET_MAX_PARALLEL_PRINTERS:-4}
      PRINTER_FLEET_DISCOVERY_INTERVAL_SECONDS: ${PRINTER_FLEET_DISCOVERY_INTERVAL_SECONDS:-30}
      PRINTER_FLEET_MEDIA_MISMATCH_TOLERANCE_MM: ${PRINTER_FLEET_MEDIA_MISMATCH_TOLERANCE_MM:-1.0}
      PRINTER_FLEET_AGENT_URLS: ${PRINTER_FLEET_AGENT_URLS:-}
      PRINTER_FLEET_MDNS_ENABLED: "0"
      PRINTER_FLEET_CREDENTIALS_JSON: >-
        {"credentials":[{"id":"printhub","token":"${PRINTHUB_FLEET_API_TOKEN:?Set PRINTHUB_FLEET_API_TOKEN}","roles":["observer","submitter"],"sites":["default"]},{"id":"operator","token":"${PRINTER_FLEET_ADMIN_TOKEN:?Set PRINTER_FLEET_ADMIN_TOKEN}","roles":["admin"],"sites":["*"]}]}
    volumes:
      - printer_fleet_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  printhub:
    image: ${PRINTHUB_IMAGE:?Load deploy/quickstart.images.env}
    pull_policy: if_not_present
    environment:
      PRINTHUB_FLEET_API_URL: http://printer-fleet:8000
      PRINTHUB_FLEET_API_TOKEN: ${PRINTHUB_FLEET_API_TOKEN:?Set PRINTHUB_FLEET_API_TOKEN}
      ZPLGRID_TEMPLATES_DIR: /data/templates
      ZPLGRID_PRINT_DRAFTS_DIR: /data/drafts
      ZPLGRID_PRINT_JOBS_DIR: /data/print-jobs
      ZPLGRID_COUNTERS_PATH: /data/counters.json
      ZPLGRID_TIMEZONE: ${TZ:-Europe/Berlin}
      PRINTHUB_MAX_LABELS_PER_JOB: ${PRINTHUB_MAX_LABELS_PER_JOB:-25}
    ports:
      - "${PRINTHUB_API_BIND:-127.0.0.1}:${PRINTHUB_API_PORT:-8001}:8000"
    volumes:
      - printhub_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    depends_on:
      printer-fleet: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks: [backend]

  studio:
    image: ${PRINTHUB_STUDIO_IMAGE:?Load deploy/quickstart.images.env}
    pull_policy: if_not_present
    environment:
      APP_BACKEND_API_BASE: /api
      APP_RENDER_API_BASE: /api
      APP_FLEET_CONSOLE_BASE: http://${PRINTHUB_PUBLIC_HOST:-printhub.local}:${PRINTER_FLEET_CONSOLE_PORT:-8089}
      APP_API_UPSTREAM: http://printhub:8000
    ports:
      - "${PRINTHUB_STUDIO_BIND:-0.0.0.0}:${PRINTHUB_STUDIO_PORT:-8088}:80"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    depends_on:
      printhub: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  fleet-console:
    image: ${PRINTER_FLEET_CONSOLE_IMAGE:?Load deploy/quickstart.images.env}
    pull_policy: if_not_present
    environment:
      FLEET_API_UPSTREAM: http://printer-fleet:8000
    ports:
      - "${PRINTER_FLEET_CONSOLE_BIND:-0.0.0.0}:${PRINTER_FLEET_CONSOLE_PORT:-8089}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /etc/nginx/http.d:rw,noexec,nosuid,nodev,mode=0755,uid=101,gid=101
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 128m
    depends_on:
      printer-fleet: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  print-agent:
    profiles: [usb-agent]
    image: ${PRINT_AGENT_IMAGE:?Load deploy/quickstart.images.env}
    pull_policy: if_not_present
    user: "${PRINT_AGENT_UID:-999}:${PRINT_AGENT_USB_GID:-999}"
    environment:
      ZPL_AGENT_CONFIG: /etc/zpl-agent/config.toml
    ports:
      - "127.0.0.1:${PRINT_AGENT_PORT:-8090}:8080"
    device_cgroup_rules:
      - "c 189:* rmw"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - print_agent_data:/var/lib/zpl-agent
      - ${PRINT_AGENT_CONFIG_SOURCE:-./state/print-agent.toml}:/etc/zpl-agent/config.toml:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped
    networks: [backend]

  ipp-gateway:
    profiles: [ipp]
    image: ${PRINTHUB_IPP_IMAGE:?Load deploy/quickstart.images.env}
    pull_policy: if_not_present
    environment:
      PRINTHUB_API_URL: http://printhub:8000
      PRINTHUB_IPP_PORT: "8631"
      PRINTHUB_IPP_TLS_DIR: /var/lib/printhub-ipp/tls
      PRINTHUB_IPP_PRINTER_ID: ${PRINTHUB_IPP_PRINTER_ID:?Set PRINTHUB_IPP_PRINTER_ID}
      PRINTHUB_IPP_HOSTNAME: ${PRINTHUB_IPP_ADVERTISED_HOST:-printhub.local}
      PRINTHUB_IPP_NAME: ${PRINTHUB_IPP_NAME:-PrintHub Label Printer}
      PRINTHUB_IPP_MISMATCH_POLICY: hold
      # ippeveprinter requires DNS-SD. Avahi remains inside this private
      # Docker network; only the separately installed host service reaches LAN.
      PRINTHUB_IPP_MDNS_ENABLED: "1"
    user: "0:0"
    ports:
      - "${PRINTHUB_IPP_BIND:-0.0.0.0}:${PRINTHUB_IPP_PORT:-8631}:8631"
    volumes:
      - ipp_spool:/var/spool/printhub-ipp
      - ipp_tls:/var/lib/printhub-ipp/tls
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    depends_on:
      printhub: {condition: service_healthy}
    healthcheck:
      test: [CMD, ipptool, -q, "ipp://127.0.0.1:8631/ipp/print", /usr/share/cups/ipptool/get-printer-attributes.test]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks: [backend]

networks:
  backend:

volumes:
  printer_fleet_data:
  printhub_data:
  print_agent_data:
  ipp_spool:
  ipp_tls:
