name: printhub-only

services:
  virtual-zebra:
    build:
      context: ../ZPL-II-Printer-Emulator
      dockerfile: Dockerfile
    environment:
      ZPL_EMULATOR_HOST: 0.0.0.0
      ZPL_EMULATOR_TCP_HOST: 0.0.0.0
      ZPL_EMULATOR_LABEL_WIDTH_IN: "1.9685"
      ZPL_EMULATOR_LABEL_HEIGHT_IN: "0.9843"
      ZPL_EMULATOR_DPMM: "8"
      ZPL_EMULATOR_MAX_JOBS: "50"
    ports:
      - "127.0.0.1:${VIRTUAL_ZEBRA_WEB_PORT:-9191}:9191"
    volumes:
      - virtual_zebra_data:/tmp/zpl-agent-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9191/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend

  printhub:
    build:
      context: ../PrintHub-ZPL-ll
      dockerfile: Dockerfile
    environment:
      ZPLGRID_TEMPLATES_DIR: /data/templates
      ZPLGRID_PRINT_DRAFTS_DIR: /data/drafts
      ZPLGRID_PRINT_JOBS_DIR: /data/print-jobs
      ZPLGRID_COUNTERS_PATH: /data/counters.json
      ZPLGRID_PRINTER_OVERRIDES_PATH: /data/printer-overrides.yml
      ZPLGRID_ZEBRA_TAMER_AGENTS: ${ZPLGRID_ZEBRA_TAMER_AGENTS:-}
      ZPLGRID_DEFAULT_PRINTER_ID: ${ZPLGRID_DEFAULT_PRINTER_ID:-virtual-zebra}
      ZPLGRID_ENABLE_LABELARY_API: ${ZPLGRID_ENABLE_LABELARY_API:-0}
      ZPLGRID_ENABLE_LABELARY_PREVIEW: ${ZPLGRID_ENABLE_LABELARY_PREVIEW:-0}
      ZPLGRID_ENABLE_LABELARY_TEMPLATES: ${ZPLGRID_ENABLE_LABELARY_TEMPLATES:-0}
      ZPLGRID_TIMEZONE: ${TZ:-Europe/Berlin}
    ports:
      - "127.0.0.1:${PRINTHUB_API_PORT:-8001}:8000"
    volumes:
      - printhub_data:/data
      - ./config/printers.yml:/app/configs/printers.yml
    depends_on:
      virtual-zebra:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend

  studio:
    build:
      context: ..
      dockerfile: LabelArchitect/Dockerfile
    environment:
      APP_BACKEND_API_BASE: /api
      APP_RENDER_API_BASE: /api
      APP_API_UPSTREAM: http://printhub:8000
      APP_LABEL_SIZE_PRESETS: 40x30,20x10,50x50,50x30,30x20,72x26
    ports:
      - "${PRINTHUB_STUDIO_PORT:-8088}:80"
    depends_on:
      printhub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:

volumes:
  printhub_data:
  virtual_zebra_data:
