name: printhub-only

services:
  virtual-zebra:
    build:
      context: ./components/ZPL-II-Printer-Emulator
      dockerfile: Dockerfile
    environment:
      ZPL_EMULATOR_HOST: 0.0.0.0
      ZPL_EMULATOR_TCP_HOST: 0.0.0.0
      ZPL_EMULATOR_LABEL_WIDTH_IN: "1.9685"
      ZPL_EMULATOR_LABEL_HEIGHT_IN: "1.9685"
      ZPL_EMULATOR_DPMM: "8"
      ZPL_EMULATOR_MAX_JOBS: "50"
    ports:
      - "127.0.0.1:${VIRTUAL_ZEBRA_WEB_PORT:-9191}:9191"
    volumes:
      - virtual_zebra_data:/tmp/zpl-agent-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9191/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend

  printhub:
    build:
      context: ./components/PrintHub-ZPL-ll
      dockerfile: Dockerfile
    environment:
      ZPLGRID_TEMPLATES_DIR: /data/templates
      ZPLGRID_PRINT_DRAFTS_DIR: /data/drafts
      ZPLGRID_PRINT_JOBS_DIR: /data/print-jobs
      ZPLGRID_COUNTERS_PATH: /data/counters.json
      ZPLGRID_PRINTER_REGISTRY_PATH: /data/printers.sqlite3
      ZPLGRID_PRINTER_SEED_PATH: /app/configs/printers.yml
      ZPLGRID_DISCOVERY_INTERVAL_SECONDS: ${ZPLGRID_DISCOVERY_INTERVAL_SECONDS:-30}
      ZPLGRID_ZEBRA_TAMER_AGENTS: ${ZPLGRID_ZEBRA_TAMER_AGENTS:-}
      ZPLGRID_DEFAULT_PRINTER_ID: ${ZPLGRID_DEFAULT_PRINTER_ID:-virtual-zebra}
      ZPLGRID_ENABLE_LABELARY_API: ${ZPLGRID_ENABLE_LABELARY_API:-0}
      ZPLGRID_ENABLE_LABELARY_PREVIEW: ${ZPLGRID_ENABLE_LABELARY_PREVIEW:-0}
      ZPLGRID_ENABLE_LABELARY_TEMPLATES: ${ZPLGRID_ENABLE_LABELARY_TEMPLATES:-0}
      ZPLGRID_TIMEZONE: ${TZ:-Europe/Berlin}
      PRINTHUB_FLEET_API_URL: http://printer-fleet:8000
      PRINTHUB_FLEET_API_TOKEN: ${PRINTER_FLEET_API_TOKEN:-dev-fleet-token}
    ports:
      - "127.0.0.1:${PRINTHUB_API_PORT:-8001}:8000"
    volumes:
      - printhub_data:/data
      - ./config/printers.yml:/app/configs/printers.yml:ro
    depends_on:
      virtual-zebra:
        condition: service_healthy
      printer-fleet:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend

  printer-fleet:
    build:
      context: ./printer-fleet
      dockerfile: Dockerfile
    environment:
      PRINTER_FLEET_DATABASE: /data/fleet.sqlite3
      PRINTER_FLEET_SEED_PATH: /app/config/printers.yml
      PRINTER_FLEET_WORKER_INTERVAL_SECONDS: "1"
      PRINTER_FLEET_DISCOVERY_INTERVAL_SECONDS: ${ZPLGRID_DISCOVERY_INTERVAL_SECONDS:-30}
      PRINTER_FLEET_AGENT_URLS: ${ZPLGRID_ZEBRA_TAMER_AGENTS:-}
      PRINTER_FLEET_MDNS_ENABLED: ${PRINTER_FLEET_MDNS_ENABLED:-1}
      PRINTER_FLEET_API_TOKEN: ${PRINTER_FLEET_API_TOKEN:-dev-fleet-token}
      PRINTER_FLEET_API_CALLER_ID: printhub
    volumes:
      - printer_fleet_data:/data
      - ./config/printers.yml:/app/config/printers.yml:ro
    depends_on:
      virtual-zebra:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  ipp-gateway:
    build:
      context: ./ipp-gateway
      dockerfile: Dockerfile
    environment:
      PRINTHUB_API_URL: http://printhub:8000
      PRINTHUB_IPP_PORT: "8631"
      PRINTHUB_IPP_PRINTER_ID: ${PRINTHUB_IPP_PRINTER_ID:-virtual-zebra}
      PRINTHUB_IPP_HOSTNAME: ${PRINTHUB_IPP_HOSTNAME:-localhost}
      PRINTHUB_IPP_NAME: ${PRINTHUB_IPP_NAME:-PrintHub Label Printer}
      PRINTHUB_IPP_MISMATCH_POLICY: ${PRINTHUB_IPP_MISMATCH_POLICY:-hold}
      PRINTHUB_IPP_MAX_PAGES: ${PRINTHUB_IPP_MAX_PAGES:-100}
      PRINTHUB_IPP_MDNS_ENABLED: "1"
    user: "0:0"
    extra_hosts:
      - "${PRINTHUB_IPP_HOSTNAME:-localhost}:127.0.0.1"
    ports:
      - "${PRINTHUB_IPP_BIND:-127.0.0.1}:${PRINTHUB_IPP_PORT:-8631}:8631"
    volumes:
      - ipp_gateway_spool:/var/spool/printhub-ipp
    depends_on:
      printhub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8631), 2).close()"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend

  studio:
    build:
      context: ./components
      dockerfile: LabelArchitect/Dockerfile
    environment:
      APP_BACKEND_API_BASE: /api
      APP_RENDER_API_BASE: /api
      APP_API_UPSTREAM: http://printhub:8000
      APP_LABEL_SIZE_PRESETS: 50x25,40x30,20x10,50x50,50x30,30x20,72x26
    ports:
      - "${PRINTHUB_STUDIO_PORT:-8088}:80"
    depends_on:
      printhub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:

volumes:
  printhub_data:
  printer_fleet_data:
  virtual_zebra_data:
  ipp_gateway_spool:
