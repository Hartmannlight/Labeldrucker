name: ${COMPOSE_PROJECT_NAME:-printhub}

services:
  bootstrap:
    image: alpine:3.22
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        umask 077
        for name in zebratamer-token printhub-admin-token raster-token; do
          target="/secrets/$$name"
          if [ ! -s "$$target" ]; then
            head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$$target"
          fi
        done
        chmod 0444 /secrets/*
    volumes:
      - printhub_secrets:/secrets
    restart: "no"
    networks: [backend]

  zebratamer:
    image: ${ZEBRATAMER_IMAGE:-ghcr.io/hartmannlight/zebratamer:latest}
    build:
      context: ./components/ZebraTamer
      dockerfile: Dockerfile
      args:
        ZPL_AGENT_GIT_COMMIT: ${ZPL_AGENT_GIT_COMMIT:-development}
    command: ["--config", "/etc/zpl-agent/config.toml"]
    user: "999:999"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "${ZEBRATAMER_BIND:-127.0.0.1}:${ZEBRATAMER_PORT:-8082}:8080"
    volumes:
      - zebratamer_data:/var/lib/zpl-agent
      - printhub_secrets:/run/printhub-secrets:ro
      - ${ZEBRATAMER_CONFIG_PATH:-./config/zebratamer.toml}:/etc/zpl-agent/config.toml:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/zpl-agent", "--healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  printhub:
    image: ${PRINTHUB_IMAGE:-ghcr.io/hartmannlight/printhub:latest}
    build:
      context: ./components/PrintHub-ZPL-ll
      dockerfile: Dockerfile
    environment:
      ZPLGRID_TEMPLATES_DIR: /data/templates
      ZPLGRID_PRINT_DRAFTS_DIR: /data/drafts
      ZPLGRID_PRINT_JOBS_DIR: /data/print-jobs
      ZPLGRID_COUNTERS_PATH: /data/counters.json
      ZPLGRID_DEFAULT_PRINTER_ID: ${ZPLGRID_DEFAULT_PRINTER_ID:-}
      ZPLGRID_ENABLE_LABELARY_API: ${ZPLGRID_ENABLE_LABELARY_API:-0}
      ZPLGRID_ENABLE_LABELARY_PREVIEW: ${ZPLGRID_ENABLE_LABELARY_PREVIEW:-0}
      ZPLGRID_ENABLE_LABELARY_TEMPLATES: ${ZPLGRID_ENABLE_LABELARY_TEMPLATES:-0}
      ZPLGRID_TIMEZONE: ${TZ:-Europe/Berlin}
      PRINTHUB_MAX_LABELS_PER_JOB: ${PRINTHUB_MAX_LABELS_PER_JOB:-25}
      PRINTHUB_BACKGROUND_JOBS: "1"
      PRINTHUB_PRINT_SERVICE_URL: http://zebratamer:8080
      PRINTHUB_PRINT_SERVICE_TOKEN_FILE: /run/printhub-secrets/zebratamer-token
      PRINTHUB_ADMIN_TOKEN_FILE: /run/printhub-secrets/printhub-admin-token
    ports:
      - "${PRINTHUB_API_BIND:-127.0.0.1}:${PRINTHUB_API_PORT:-8001}:8000"
    volumes:
      - printhub_data:/data
      - printhub_secrets:/run/printhub-secrets:ro
    depends_on:
      zebratamer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks: [backend, renderer-egress]

  studio:
    image: ${PRINTHUB_STUDIO_IMAGE:-ghcr.io/hartmannlight/printhub-studio:latest}
    build:
      context: ./components
      dockerfile: LabelArchitect/Dockerfile
    environment:
      APP_BACKEND_API_BASE: /api
      APP_RENDER_API_BASE: /api
      APP_API_UPSTREAM: http://printhub:8000
      APP_LABEL_SIZE_PRESETS: 50x25,40x30,20x10,50x50,50x30,30x20,72x26
    ports:
      - "${PRINTHUB_STUDIO_BIND:-127.0.0.1}:${PRINTHUB_STUDIO_PORT:-8088}:80"
    depends_on:
      printhub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  ipp-gateway:
    image: ${PRINTHUB_IPP_IMAGE:-ghcr.io/hartmannlight/printhub-ipp:latest}
    build:
      context: ./components/PrintHub-ZPL-ll/ipp-gateway
      dockerfile: Dockerfile
    environment:
      PRINTHUB_API_URL: http://printhub:8000
      PRINTHUB_IPP_TLS_DIR: /var/lib/printhub-ipp/tls
      PRINTHUB_IPP_HOSTNAME: ${PRINTHUB_IPP_HOSTNAME:-localhost}
      PRINTHUB_IPP_MISMATCH_POLICY: ${PRINTHUB_IPP_MISMATCH_POLICY:-hold}
      PRINTHUB_IPP_MAX_PAGES: ${PRINTHUB_IPP_MAX_PAGES:-100}
      PRINTHUB_IPP_MDNS_ENABLED: "1"
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    ports:
      - "${PRINTHUB_IPP_BIND:-127.0.0.1}:8631-8650:8631-8650"
    volumes:
      - ipp_gateway_spool:/var/spool/printhub-ipp
      - ipp_gateway_tls:/var/lib/printhub-ipp/tls
    depends_on:
      printhub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8799/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    extra_hosts:
      # ippeveprinter resolves its advertised name when opening the listener.
      # Keep that listener on loopback; entrypoint.py proxies it to the container NIC.
      - "${PRINTHUB_IPP_HOSTNAME:-localhost}=127.0.0.1"
      - "${PRINTHUB_IPP_HOSTNAME:-localhost}=::1"
    restart: unless-stopped
    networks: [backend]

networks:
  backend:
    internal: true
  renderer-egress:

volumes:
  printhub_data:
  printhub_secrets:
  zebratamer_data:
  ipp_gateway_spool:
  ipp_gateway_tls:
