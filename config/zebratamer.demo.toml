listen = "0.0.0.0:8080"
data_dir = "/var/lib/zpl-agent"
storage_mode = "full"
webui_enabled = true
read_token_file = "/run/printhub-secrets/zebratamer-token"
print_token_file = "/run/printhub-secrets/zebratamer-token"
admin_token_file = "/run/printhub-secrets/zebratamer-token"
mdns_enabled = false
printer_reconnect_loss_labels = 0
max_job_bytes = 8388608
max_active_jobs_per_printer = 1000

[[printers]]
id = "virtual-zebra"
display_name = "Virtueller Zebra"
enabled = true
device = ""
transport = "tcp"
tcp_host = "virtual-zebra"
tcp_port = 9100
driver = "zpl"
first_byte_timeout_ms = 250
idle_timeout_ms = 100
write_timeout_ms = 5000

[printers.device_profile]
resolution_dpi = 203
max_width_dots = 400
max_length_dots = 200
max_speed_ips = 6
max_offset_dots = 64
thermal_transfer = false
peel_off = false
cutter = false
