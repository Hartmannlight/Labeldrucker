<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <title>PrintHub Chrome photo 50 x 25 mm landscape</title>
    <style>
      @page {
        size: 50mm 25mm;
        margin: 0;
      }

      html,
      body,
      svg {
        display: block;
        width: 50mm;
        height: 25mm;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250"
         role="img" aria-label="Candidate 6 Chrome high-quality landscape fixture">
      <defs>
        <linearGradient id="gray" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#000000"/>
          <stop offset="0.5" stop-color="#808080"/>
          <stop offset="1" stop-color="#ffffff"/>
        </linearGradient>
        <linearGradient id="color" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ff0000"/>
          <stop offset="0.2" stop-color="#ffff00"/>
          <stop offset="0.4" stop-color="#00ff00"/>
          <stop offset="0.6" stop-color="#00ffff"/>
          <stop offset="0.8" stop-color="#0000ff"/>
          <stop offset="1" stop-color="#ff00ff"/>
        </linearGradient>
        <radialGradient id="photo" cx="35%" cy="35%" r="75%">
          <stop offset="0" stop-color="#fff3a0"/>
          <stop offset="0.32" stop-color="#ef7f43"/>
          <stop offset="0.68" stop-color="#3d6fb4"/>
          <stop offset="1" stop-color="#17213a"/>
        </radialGradient>
        <pattern id="lines" width="12" height="12" patternUnits="userSpaceOnUse"
                 patternTransform="rotate(35)">
          <rect width="6" height="12" fill="#111111"/>
          <rect x="6" width="6" height="12" fill="#eeeeee"/>
        </pattern>
      </defs>

      <rect x="1.5" y="1.5" width="497" height="247" rx="5"
            fill="#ffffff" stroke="#000000" stroke-width="3"/>
      <text x="18" y="31" font-family="Arial, sans-serif" font-size="20"
            font-weight="700">C6 CHROME HIGH · LANDSCAPE</text>
      <text x="482" y="31" text-anchor="end" font-family="Arial, sans-serif"
            font-size="15">50 × 25 mm</text>

      <rect x="18" y="48" width="464" height="42" fill="url(#gray)"
            stroke="#000000" stroke-width="2"/>
      <g fill="#000000" font-family="Arial, sans-serif" font-size="12">
        <text x="22" y="104">BLACK</text>
        <text x="250" y="104" text-anchor="middle">MIDTONES</text>
        <text x="478" y="104" text-anchor="end">WHITE</text>
      </g>

      <rect x="18" y="116" width="294" height="48" fill="url(#color)"
            stroke="#000000" stroke-width="2"/>
      <rect x="324" y="116" width="158" height="116" fill="url(#photo)"
            stroke="#000000" stroke-width="2"/>
      <circle cx="379" cy="158" r="27" fill="#ffffff" fill-opacity="0.58"/>
      <path d="M334 218 L368 177 L397 204 L423 170 L472 218 Z"
            fill="#101820" fill-opacity="0.72"/>

      <rect x="18" y="176" width="138" height="56" fill="url(#lines)"
            stroke="#000000" stroke-width="2"/>
      <g stroke="#000000" fill="none">
        <circle cx="190" cy="204" r="27" stroke-width="1"/>
        <circle cx="190" cy="204" r="20" stroke-width="2"/>
        <circle cx="190" cy="204" r="12" stroke-width="3"/>
        <path d="M163 204 H217 M190 177 V231" stroke-width="1"/>
      </g>
      <g x="230" font-family="Arial, sans-serif" fill="#000000">
        <text x="230" y="193" font-size="14" font-weight="700">HIGH</text>
        <text x="230" y="211" font-size="14" font-weight="700">DITHER</text>
        <text x="230" y="227" font-size="10">NO CROP</text>
      </g>
    </svg>
  </body>
</html>
