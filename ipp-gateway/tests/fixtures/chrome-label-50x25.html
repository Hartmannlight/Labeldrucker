<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <title>PrintHub Chrome IPP 50 x 25 mm</title>
    <style>
      @page {
        size: 50mm 25mm;
        margin: 0;
      }

      html,
      body {
        width: 50mm;
        height: 25mm;
        margin: 0;
        padding: 0;
      }

      body {
        color: #000;
        background: #fff;
        font-family: Arial, Helvetica, sans-serif;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .label {
        box-sizing: border-box;
        display: grid;
        grid-template-rows: 1fr auto;
        width: 50mm;
        height: 25mm;
        border: 0.25mm solid #000;
        padding: 1.5mm;
      }

      .title {
        align-self: center;
        font-size: 4mm;
        font-weight: 700;
        line-height: 1;
        text-align: center;
      }

      .details {
        display: flex;
        justify-content: space-between;
        border-top: 0.25mm solid #000;
        padding-top: 1mm;
        font-size: 2.2mm;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <main class="label">
      <div class="title">CHROME IPP</div>
      <div class="details">
        <span>50 × 25 mm</span>
        <span>ONE PAGE</span>
      </div>
    </main>
  </body>
</html>
